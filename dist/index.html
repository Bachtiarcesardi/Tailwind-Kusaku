        <!--Input-->
        <h1 class="text-center text-2xl text-gray-900">Input Text</h1>
        <div>
            <label for="my-input-text" class="ps-4 text-sm font-medium uppercase text-gray-900">Input Label</label>
            <div class="relative">
                <input id="my-input-text" type="email" class="peer w-full rounded-2xl border border-gray-400 bg-white 
                p-3 pe-12 ps-12 text-sm text-gray-900 placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:invalid:ring-red-900 focus:ring-green-400 
                invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 disabled:border-gray-300 disabled:bg-gray-100" 
                placeholder="Input Placeholder"/>
                <div class="absolute start-0 inset-y-0 text-icon-md flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 
                peer-invalid:peer-focus:text-red-900">
                    <span class="i-material-symbols-arrow-left-alt"></span>
                </div>
                <div class="absolute inset-y-0 end-0 text-icon-md flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 
                peer-invalid:peer-focus:text-red-900">
                    <span class="i-material-symbols-arrow-right-alt"></span>
                </div>
            </div>
            <p class="ps-4 text-xs text-gray-900">This is for hint!</p>
        </div>
        <!--./ Input Select-->
        <!-- Input Select -->
        <h1 class="text-center text-2xl text-gray-900">Input Select</h1>
        <div class="flex flex-col gap-y-1.5">
          <label
            for="my-input-select"
            class="ps-4 text-sm font-medium uppercase text-gray-900"
            >Input Label</label
          >
          <div class="relative">
            <select
              id="my-input-select"
              type="email"
              class="placeholder:text-gray400 peer w-full appearance-none rounded-2xl border border-gray-400 bg-white p-3 pe-12 ps-12 text-sm text-gray-900 invalid:bg-red-200 invalid:text-red-900 invalid:caret-red-900 focus:outline-none focus:ring-2 focus:ring-green-400 focus:invalid:ring-red-900 disabled:border-gray-300 disabled:bg-gray-100"
            >
              <option value="option-1">Option 1</option>
              <option value="option-2">Option 2</option>
              <option value="option-3">Option 3</option>
            </select>
            <div
              class="text-icon-md absolute inset-y-0 start-0 flex items-center ps-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
            >
              <span class="i-material-symbols-arrow-left-alt"></span>
            </div>
            <div
              class="text-icon-md absolute inset-y-0 end-0 flex items-center pe-4 text-gray-400 peer-invalid:text-red-400 peer-invalid:peer-focus:text-red-900"
            >
              <span class="i-material-symbols-keyboard-arrow-down"></span>
            </div>
          </div>
          <p class="ps-4 text-xs text-gray-900">This is for hint!</p>
